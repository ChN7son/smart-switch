<!DOCTYPE html>
<html lang="en">
<head>
	<title>智慧燈具管理</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://kit.fontawesome.com/8682db5ee1.js" crossorigin="anonymous"></script><!--可能有期限-->
	<script src="../html/device.js"></script>
	<script>
	t=setInterval("atime()",30000);
	function changeDevname(n) {
		const devname = document.getElementById("devname"+n).value.trim();
		var fd = new FormData();
		fd.append("dop", 2);
		fd.append("id", n);
		fd.append("devname", devname);

		var xhr = new XMLHttpRequest();
		xhr.addEventListener("load", function(){
			let item = JSON.parse(xhr.responseText);
			if (item.status==1){
				document.getElementById("devname"+n).style.border="1px solid green";
			} else {
				document.getElementById("devname"+n).style.border="1px solid red";
				alert(item.msg);
			}
		}, true);
		//xhr.addEventListener("error", uploadFailed, false);
		xhr.open("POST", "action.php?action=device");
		xhr.send(fd);
	}
	function topSetting(n) {
		var fd = new FormData();
		fd.append("swop", 2);
		fd.append("id", n);

		var xhr = new XMLHttpRequest();
		xhr.addEventListener("load", function(){
			let item = JSON.parse(xhr.responseText);
			if (item.status==1){
				let classVal = document.getElementById("topicon"+n).getAttribute("class");
				if (item.top==1)
					classVal = classVal.replace("fas fa-heart","far fa-heart");
				else
					classVal = classVal.replace("far fa-heart","fas fa-heart");
				document.getElementById("topicon"+n).setAttribute("class",classVal);
			} else {
				alert(item.msg);
			}
		}, true);
		//xhr.addEventListener("error", uploadFailed, false);
		xhr.open("POST", "switch.php");
		xhr.send(fd);
	}
	function init(){
		atime();
		$.ajax({
			url: 'action.php?action=device',
			type: 'POST',
			data: {dop: 0, top: 0},
			success: function(response) {
				let data=response.split("\n");
				const datalength=parseInt(data.length-1);
				const cnt=parseInt(data[datalength]);
				let devname='<div class="row">';
				let devname2='';
				for (var i=0;i<cnt;i++){
					let item = JSON.parse(data[i]);
					let status = '';
					let top = 'far fa-heart';
					if (item.state==1)
						status = ' checked';
					if (item.top==1)
						top = 'fas fa-heart';
					devname2=devname2+'<tr><td><input type="text" class="form-control" id="devname'+item.id+'" value="'+item.devname.trim()+'" onchange="changeDevname('+item.id+')" /></td><td>'+item.ip+'</td><td>'+item.price+'</td><td>'+item.access+'</td><td><button type="button" class="btn btn-outline-danger btn-sm">刪除</button></td></tr>';
					devname=devname+'<div class="col-6 col-lg-3 pt-5"><h5>'+item.devname.trim()+' <span class="'+top+' text-danger" id="topicon'+item.id+'" role="button" onclick="topSetting('+item.id+')"></span></h5>'+
					`
					<div class="center">
						<div class="switch_demo">
							<input type="checkbox" class="switch_demo-checkbox" id="switch_demo`+item.id+`"`+status+` onclick="powerSwitch(`+item.id+`)">
							<label class="switch_demo-label" for="switch_demo`+item.id+`">
							<span class="switch_demo-inner"></span>
							<span class="switch_demo-switch"></span>
							</label>
						</div>
					</div>
					</div>
					`;
				}
				document.getElementById("control").innerHTML = devname+'</div>';
				document.getElementById("editlist").innerHTML = devname2;
			}
		});
	}
	</script>
	<style>
	.switch_demo {
	position: relative;
	width: 150px;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;
	}
	.switch_demo-checkbox {
	display: none;
	}
	.switch_demo-label {
	display: block;
	overflow: hidden;
	cursor: pointer;
	border: 2px solid #999999;
	border-radius: 20px;
	}
	.switch_demo-inner {
	display: block;
	width: 200%;
	margin-left: -100%;
	transition: margin 0.3s ease-in 0s;
	}
	.switch_demo-inner:before,
	.switch_demo-inner:after {
	display: block;
	float: left;
	width: 50%;
	height: 30px;
	padding: 0;
	line-height: 30px;
	font-size: 14px;
	color: white;
	font-family: Trebuchet, Arial, sans-serif;
	font-weight: bold;
	box-sizing: border-box;
	}
	.switch_demo-inner:before {
	content: "開啟";
	padding-left: 10px;
	background-color: #34A7C1;
	color: #FFFFFF;
	}
	.switch_demo-inner:after {
	content: "關閉";
	padding-right: 10px;
	background-color: #EEEEEE;
	color: #999999;
	text-align: right;
	}
	.switch_demo-switch {
	display: block;
	width: 18px;
	margin: 6px;
	background: #FFFFFF;
	position: absolute;
	top: 0;
	bottom: 0;
	right: 116px;
	border: 2px solid #999999;
	border-radius: 20px;
	transition: all 0.3s ease-in 0s;
	}
	.switch_demo-checkbox:checked + .switch_demo-label .switch_demo-inner {
	margin-left: 0;
	}
	.switch_demo-checkbox:checked + .switch_demo-label .switch_demo-switch {
	right: 0px;
	}
	</style>
</head>
<body onload="init()">
%nav_bar%
<div class="container">
	<div class="row mt-3">
		<div class="col-3">
			<div class="card bg-danger text-white" id="atimeState" style="height:150px;">
				<div class="card-body">主機狀態<h2 id="atimeState2"></h2></div>
			</div>
		</div>
		<div class="col-3">
			<div class="card bg-light" style="height:150px;">
				<div class="card-body">在線設備<h2>15<span style="font-size:14pt;">/15<span></h2></div>
			</div>
		</div>
	</div>
	<br>
	<h2>設備總覽</h2>
	<ul class="nav nav-tabs">
		<li class="nav-item">
			<a class="nav-link active" data-toggle="tab" href="#control">控制</a>
		</li>
		<li class="nav-item">
			<a class="nav-link" data-toggle="tab" href="#edit">編輯</a>
		</li>
	</ul>
	<!-- Tab panes -->
	<div class="tab-content">
		<div id="control" class="container tab-pane active"><br>
			
		</div>
		<div id="edit" class="container tab-pane fade"><br>
			<table class="table table-bordered">
				<thead>
					<tr>
						<th>裝置名稱</th>
						<th>IP</th>
						<th width="10%">價錢</th>
						<th width="10%">開放權限</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody id="editlist">
					
				</tbody>
			</table>
		</div>
	</div>
</div>


</body>
</html>
