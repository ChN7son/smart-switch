<!DOCTYPE html>
<html lang="en">
<head>
	<title>智慧燈具管理</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://kit.fontawesome.com/8682db5ee1.js" crossorigin="anonymous"></script><!--可能有期限-->
	<script>
	function add(){
		const device = document.getElementById('device').value;
		const status = document.getElementById('status').value;
		const weekdays = document.getElementById('weekdays').value;
		const execute_time = document.getElementById('execute_time').value;
		const execute_repeat = document.getElementById('execute_repeat').checked;

		if (device == '' || execute_time == ''){
			alert("裝置與時間為必填");
			return;
		}
		
		var fd = new FormData();
		fd.append("cop", 1);
		fd.append("device", device);
		fd.append("status", status);
		fd.append("weekdays", weekdays);
		fd.append("execute_time", execute_time);
		fd.append("execute_repeat", execute_repeat);
	
		var xhr = new XMLHttpRequest();
		xhr.addEventListener("load", function(){
			let item = JSON.parse(xhr.responseText);
			if (item.status==1){
				window.location.reload();
			} else {
				alert(item.msg);
			}
		}, true);
		//xhr.addEventListener("error", uploadFailed, false);
		xhr.open("POST", "action.php?action=cron");
		xhr.send(fd);
	}
	function del(n){
		if (confirm("此操作不可逆，請確認刪除這個排程？")) {
			var fd = new FormData();
			fd.append("cop", 3);
			fd.append("id", n);
	
			var xhr = new XMLHttpRequest();
			xhr.addEventListener("load", function(){
				let item = JSON.parse(xhr.responseText);
				if (item.status==1){
					window.location.reload();
				} else {
					alert(item.msg);
				}
			}, true);
			//xhr.addEventListener("error", uploadFailed, false);
			xhr.open("POST", "action.php?action=cron");
			xhr.send(fd);
		}
	}
	</script>
	<style>
	.weekday-picker {
		display: flex;
		gap: 6px;
	}
	
	.weekday {
		width: 56px;
		height: 56px;
		border: 1px solid #ced4da;
		border-radius: 6px;
		display: flex;
		align-items: center;
		justify-content: center;
		cursor: pointer;
		color: #495057;
		user-select: none;
		transition: all 0.15s ease;
		font-size: 20px;
		font-weight: bold;
	}
	
	.weekday:hover {
		border-color: #0d6efd;
		color: #0d6efd;
	}
	
	.weekday.active {
		background-color: #0d6efd;
		border-color: #0d6efd;
		color: #fff;
	}
	.custom-select {
		width: 100%;
		padding: 8px 12px;
		font-size: 16px;
		border-radius: 6px;
		border: 1px solid gray;
		-webkit-appearance: none;
		-moz-appearance: none;
		cursor: pointer;
		transition: all 0.2s ease;
	}
	</style>
</head>
<body>
%nav_bar%
<div class="container">
	<div class="pt-3">
		<h2 style="color: #3b6304;">加入設定</h2>
	</div>
	<div class="pt-3 pb-3">
		<div class="row">
			<div class="col-8">
				裝置：
				<select class="custom-select" id="device">
					<option value="" selected>------</option>
					%option_device%
				</select>
			</div>
			<div class="col-4">
				ON/OFF：
				<select class="custom-select" id="status">
					<option value="1">開啟</option>
					<option value="0">關閉</option>
				</select>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="col-6">
			<div class="weekday-picker" id="weekdayPicker">
				<span class="weekday" data-day="1">一</span>
				<span class="weekday" data-day="2">二</span>
				<span class="weekday" data-day="3">三</span>
				<span class="weekday" data-day="4">四</span>
				<span class="weekday" data-day="5">五</span>
				<span class="weekday" data-day="6">六</span>
				<span class="weekday" data-day="7">日</span>
				<input type="hidden" id="weekdays" name="weekdays">
			</div>
		</div>
		
		<div class="col-6">
			<div class="row g-2 align-items-center">
				<div class="col-auto">
					<label class="form-label mb-0">執行時間</label>
				</div>
				<div class="col-auto">
					<input type="time" class="form-control" id="execute_time" name="execute_time" step="60">
				</div>
			</div>
		</div>
		<div class="pl-3" style="display:flex; align-items:center; gap:12px; margin: 20px 0 30px 0;">
			<button class="btn btn-warning" style="font-size: 18px;" onclick="add()">
			加入
			</button>
			<label style="display:flex; align-items:center; cursor:pointer; gap:6px;">
				<input type="checkbox" id="execute_repeat" style="transform: scale(1.5);vertical-align: middle;">
				<span style="font-size: 18px;">重複</span>
			</label>
		</div>
	</div>
	<hr>
	<h2>目前排程</h2>
	<table class="table table-bordered">
		<thead>
			<tr>
				<th>裝置</th>
				<th>操作</th>
				<th>時間</th>
				<th>週期</th>
				<th>重複</th>
				<th></th>
			</tr>
		</thead>
		<tbody>
			%cron_list%
		<tbody>
	</table>
</div>
<script>
document.querySelectorAll('.weekday').forEach(el => {
	el.addEventListener('click', function () {
		this.classList.toggle('active');
		updateWeekdays();
	});
});

function updateWeekdays() {
	const selected = [];
	document.querySelectorAll('.weekday.active').forEach(el => {
		selected.push(el.dataset.day);
	});
	document.getElementById('weekdays').value = selected.join(',');
}
</script>
</body>
</html>
