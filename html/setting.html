<!DOCTYPE html>
<html lang="zh_tw">
<head>
	<meta charset="utf-8">
	<title>智慧燈具管理</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://kit.fontawesome.com/8682db5ee1.js" crossorigin="anonymous"></script><!--可能有期限-->
	<script>
	var xhr;
	function chname(){
		const nname = document.getElementById("nname").value;
		var fd = new FormData();
		fd.append("nname", nname);

		var xhr = new XMLHttpRequest();
		xhr.addEventListener("load", function(){
			let item = JSON.parse(xhr.responseText);
			showData(item.msg);
		}, true);
		//xhr.addEventListener("error", uploadFailed, false);
		xhr.open("POST", "action.php?action=setting");
		xhr.send(fd);
	}
	function showData(msg){
		document.getElementById("msg").innerHTML = msg;
		const modal = new bootstrap.Modal(document.getElementById('myModal'));
		modal.show();
	}
	</script>
</head>
<body>

<div class="jumbotron text-center"  style="background-image: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);">
	<h2>燈光控制系統</h2>
	<p>歡迎使用燈光控制小幫手 <i class="fa fa-smile-o"></i></p> 
</div>

<div class="container">
	<div class="row">
		<div class="col-sm-12">
			<div class="text-center cc">
				<h2>修改設備名稱</h2>
				<br/>
				<form style="font-size:150%;">
					<div class="form-group text-left">
						<label>新設備名稱：</label>
						<input type="text" class="form-control input-lg" id="nname" name="nname" placeholder="請輸入設備名稱">
					</div>
					<button type="button" class="btn btn-primary btn-lg" style="margin-left:5px;margin-right:5px;" name="set" onclick="chname()">修改</button>
					<button type="button" class="btn btn-default btn-lg" style="margin-left:5px;margin-right:5px;" onclick="javascript:location.href='index.php'">回首頁</button>
				</form>
			</div>
		</div>
	</div>
</div>

<!-- Modal -->
<div id="myModal" class="modal fade" role="dialog">
  <div class="modal-dialog">
    <!-- Modal content-->
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <p id="msg"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
      </div>
    </div>

  </div>
</div>

</body>
