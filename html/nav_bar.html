<script>
function logout(){
	const url = 'action.php?action=login';
	var data=new FormData();
	data.append("logout", 1);
	var xhr = new XMLHttpRequest();
	xhr.addEventListener("load", reloadComplete, false);
	xhr.open("POST", url);
	xhr.send(data);
}
function reloadComplete(evt) {
	location.reload();
}
</script>
