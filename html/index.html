<!DOCTYPE html>
<html lang="en">
<head>
	<title>智慧燈具管理</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="device.js"></script>
	<script>
	document.getElementById("dname").innerHTML = result.dname.trim();
	$.ajax({
		url: 'device.php',
		type: 'POST',
		data: {dop: 0, top: 1},
		success: function(response) {
			let data=response.split("\n");
			const datalength=parseInt(data.length-1);
			const cnt=parseInt(data[datalength]);
			let devname='<div class="row">';
			for (var i=0;i<cnt;i++){
				let item = JSON.parse(data[i]);
				let status = '';
				if (item.state==1)
					status = ' checked';
				devname=devname+'<div class="col-6 col-lg-3 pt-5"><h5>'+item.devname.trim()+
				`
				<div class="center">
					<div class="switch_demo">
						<input type="checkbox" class="switch_demo-checkbox" id="switch_demo`+item.id+`"`+status+` onclick="powerSwitch(`+item.id+`)">
						<label class="switch_demo-label" for="switch_demo`+item.id+`">
						<span class="switch_demo-inner"></span>
						<span class="switch_demo-switch"></span>
						</label>
					</div>
				</div>
				</div>
				`;
			}
			document.getElementById("top").innerHTML = devname+'</div>';
		}
	});		
	</script>
	<style>
	.switch_demo {
	position: relative;
	width: 150px;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;
	}
	.switch_demo-checkbox {
	display: none;
	}
	.switch_demo-label {
	display: block;
	overflow: hidden;
	cursor: pointer;
	border: 2px solid #999999;
	border-radius: 20px;
	}
	.switch_demo-inner {
	display: block;
	width: 200%;
	margin-left: -100%;
	transition: margin 0.3s ease-in 0s;
	}
	.switch_demo-inner:before,
	.switch_demo-inner:after {
	display: block;
	float: left;
	width: 50%;
	height: 30px;
	padding: 0;
	line-height: 30px;
	font-size: 14px;
	color: white;
	font-family: Trebuchet, Arial, sans-serif;
	font-weight: bold;
	box-sizing: border-box;
	}
	.switch_demo-inner:before {
	content: "開啟";
	padding-left: 10px;
	background-color: #34A7C1;
	color: #FFFFFF;
	}
	.switch_demo-inner:after {
	content: "關閉";
	padding-right: 10px;
	background-color: #EEEEEE;
	color: #999999;
	text-align: right;
	}
	.switch_demo-switch {
	display: block;
	width: 18px;
	margin: 6px;
	background: #FFFFFF;
	position: absolute;
	top: 0;
	bottom: 0;
	right: 116px;
	border: 2px solid #999999;
	border-radius: 20px;
	transition: all 0.3s ease-in 0s;
	}
	.switch_demo-checkbox:checked + .switch_demo-label .switch_demo-inner {
	margin-left: 0;
	}
	.switch_demo-checkbox:checked + .switch_demo-label .switch_demo-switch {
	right: 0px;
	}
	.fast:hover {
		background-color:gray;
	}
	</style>
</head>
<body>
%nav_bar%
<div class="container">
	<div class="row mt-3">
		<div class="col-3">
			<div class="card bg-info text-white" style="height:150px;">
				<div class="card-body fast" role="button">下一次排程<h2 class="pb-1">無</h2></div>
			</div>
		</div>
		<div class="col-3">
			<p>取消此排程</p>
			<p>加入臨時排程</p>
		</div>
		<div class="col-3">
			<div class="card bg-danger text-white" id="atimeState" style="height:150px;">
				<div class="card-body">主機狀態<h2 id="atimeState2"></h2></div>
			</div>
		</div>
		<div class="col-3">
			<div class="card bg-light" style="height:150px;">
				<div class="card-body fast" role="button">在線設備<h2>15<span style="font-size:14pt;">/15<span></h2></div>
			</div>
		</div>
	</div>
	<br>
	<h2>快速使用</h2>
	<ul class="nav nav-tabs">
		<li class="nav-item">
			<a class="nav-link active" data-toggle="tab" href="#top">精選</a>
		</li>
		<li class="nav-item">
			<a class="nav-link" data-toggle="tab" href="#history">常用</a>
		</li>
	</ul>
	<!-- Tab panes -->
	<div class="tab-content">
		<div id="top" class="container tab-pane active"><br>
			
		</div>
		<div id="history" class="container tab-pane fade"><br>

		</div>
	</div>
	<br>
	<!--
	<h2>使用中</h2>
	...
	-->
</div>


</body>
</html>
