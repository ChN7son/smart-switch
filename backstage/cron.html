<!doctype html>
<html lang="zh-hant">
<head>
<meta charset="utf-8">
<script>
var xhr,xhr1,xhr2,xhr3;
var devstable=[];
function init()
{
	devread();
	cronread();
}
function setcron()
{
    url= "setcron.php";
    var fd = new FormData();
    var min=document.getElementById("min");
    var h=document.getElementById("h");
    var d=document.getElementById("d");
    var m=document.getElementById("m");
    var w=document.getElementById("w");
    var act=document.getElementById("act");
    fd.append("devid", dev.options[dev.selectedIndex].value);
    fd.append("min", min.options[min.selectedIndex].value);
    fd.append("h", h.options[h.selectedIndex].value);
    fd.append("d", d.options[d.selectedIndex].value);
    fd.append("m", m.options[m.selectedIndex].value);
    fd.append("w", w.options[w.selectedIndex].value);
    fd.append("act", act.options[act.selectedIndex].value);
    try {
    	xhr2=new XMLHttpRequest(); //建立一個AJAX物件
        if (xhr2.overrideMimeType) xhr2.overrideMimeType('text/xml');
    }
    catch (e) { 
		alert("Your Browser doesn't support XMLHttpRequest"); 
		return false; 
	}
    xhr2.onreadystatechange = function() {
        	if (xhr2.readyState==4 && xhr2.status==200) //如果呼叫成功，處理底下
        	{ 
			if (parseInt(xhr2.responseText)!=1)
				alert("Set schedule Fail!="+xhr2.responseText);
			else cronread();
		}
    	}
    xhr2.open("post",url,true);
    xhr2.send(fd);
}
function devread()
{
    url= "dev.php";
    try {
    	xhr1=new XMLHttpRequest(); //建立一個AJAX物件
        if (xhr1.overrideMimeType) xhr1.overrideMimeType('text/xml');
    }
    catch (e) { 
		alert("Your Browser doesn't support XMLHttpRequest"); 
		return false; 
	}
    xhr1.onreadystatechange = function() {
        	if (xhr1.readyState==4 && xhr1.status==200) 
        	{ 
			var data=JSON.parse(xhr1.responseText);
			var devObj = document.getElementById("dev");
			if (data.length<=0)
			{
            			dev.options[0]=new Option("尚無資料",0);
			}
			else
			{
				for (var i=0;i<data.length;i++)
				{
            				dev.options[i]=new Option(data[i].devname,data[i].ip);
					devstable[data[i].ip]=data[i].devname;
				}
			}
		}
    	}
    xhr1.open("get",url,true);
    xhr1.setRequestHeader('Content-Type','application/x-www-urlencoded; charset=utf-8');
    xhr1.send(null);
}
function delcron(x)
{
    url= "setcron.php";
    var fd = new FormData();
    fd.append("op", -3);
    fd.append("line",x );
    try {
        xhr3=new XMLHttpRequest(); //建立一個AJAX物件
        if (xhr3.overrideMimeType) xhr3.overrideMimeType('text/xml');
    }
    catch (e) {
                alert("Your Browser doesn't support XMLHttpRequest");
                return false;
        }
    xhr3.onreadystatechange = function() {
                if (xhr3.readyState==4 && xhr3.status==200) //如果呼叫成功，處理底下
                {
                        if (parseInt(xhr3.responseText)!=1)
                                alert("Del schedule Fail!"+xhr3.responseText);
                        else cronread();
                }
        }
    xhr3.open("post",url,true);
    xhr3.send(fd);
}
function cronread()
{
    url= "cron.php";
    try {
    	xhr=new XMLHttpRequest(); //建立一個AJAX物件
        if (xhr.overrideMimeType) xhr.overrideMimeType('text/xml');
    }
    catch (e) { 
		alert("Your Browser doesn't support XMLHttpRequest"); 
		return false; 
	}
    xhr.onreadystatechange = function() {
        	if (xhr.readyState==4 && xhr.status==200) //如果呼叫成功，處理底下
        	{ 
			var data=JSON.parse(xhr.responseText);
			var schedule=document.getElementById("schedule");
			if (data.length<=0)
			{
				document.getElementById("schedule").innerHTML="尚無資料";
			}
			else
			{
				var s='<table border="1"><tr align="center"><td>裝置</td><td>&nbsp;月&nbsp;</td><td>&nbsp;週&nbsp;</td><td>&nbsp;日&nbsp;</td><td>&nbsp;時&nbsp;</td><td>&nbsp;分&nbsp;</td><td>動作</td><td>處理</td></tr>';
				for (i=0;i<data.length;i=i+1){
					if (data[i].trim().length==0) continue;
					var item=data[i].split(" ");
					var ss=item[6].split(":");
					var onoff;
					if (parseInt(ss[1])==-100) onoff="on";
					else onoff="off";
					s=s+'<tr align="center"><td>'+devstable[ss[0]]+'</td><td>'+item[3]+"</td><td>"+item[4]+"</td><td>"+item[2]+"</td><td>"+item[1]+
					"</td><td>"+item[0]+"</td><td>"+onoff+"</td><td>"+'<button onclick="delcron('+i+')">刪除</button></tr>';
				}
				s=s+"</table>";
				schedule.innerHTML=s;
			}
		}
    	}
    xhr.open("get",url,true);
    xhr.setRequestHeader('Content-Type','application/x-www-urlencoded; charset=utf-8');
    xhr.send(null);
}
</script>
