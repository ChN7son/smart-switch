<!DOCTYPE html>
<html lang="zh_tw">
<head>
	<meta charset="utf-8">
	<title>燈光控制設備名稱修改</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="ncss/bootstrap.min.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<script src="njs/jquery.min.js"></script>
	<script src="njs/bootstrap.min.js"></script>
	<script>
	var xhr;
	function chname(){
		var nname=document.getElementById("nname").value;
		var url= "upname.php?nname="+encodeURIComponent(nname);
		try
		{  xhr=new XMLHttpRequest(); //建立一個AJAX物件
			if (xhr.overrideMimeType) xhr.overrideMimeType('text/xml');}
			catch (e)   {  try
				{ xhr=new ActiveXObject("Msxml2.XMLHTTP"); }//如果標準的建不起來，用IE的方法建立
				catch (ee)
				{ alert("Your Browser doesn't support XMLHttpRequest"); return false; }}
				xhr.onreadystatechange = function()
				{
					if (xhr.readyState==4 && xhr.status==200) //如果呼叫成功，處理底下
						showData();
				}
		xhr.open("get",url,true);
		xhr.setRequestHeader('Content-Type','application/x-www-urlencoded; charset=utf-8');
		xhr.send(null);
	}
	function showData()
	{
		var data= xhr.responseText;
			document.getElementById("msg").innerHTML=data;
			$('#myModal').modal('show');
	}
	</script>
</head>
<body>

<div class="jumbotron text-center"  style="background-image: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);">
	<h2>燈光控制系統</h2>
	<p>歡迎使用燈光控制小幫手 <i class="fa fa-smile-o"></i></p> 
</div>

<div class="container">
	<div class="row">
		<div class="col-sm-12">
			<div class="text-center cc">
				<h2>修改設備名稱</h2>
				<br/>
				<form style="font-size:150%;">
					<div class="form-group text-left">
						<label>新設備名稱：</label>
						<input type="text" class="form-control input-lg" id="nname" name="nname" placeholder="請輸入設備名稱">
					</div>
					<button type="button" class="btn btn-primary btn-lg" style="margin-left:5px;margin-right:5px;" name="set" onclick="chname()">修改</button>
					<button type="button" class="btn btn-default btn-lg" style="margin-left:5px;margin-right:5px;" onclick="javascript:location.href='index.html'">回首頁</button>
				</form>
				<!-- <div id="msg"></div> -->
			</div>
		</div>
	</div>
</div>

<!-- Modal -->
<div id="myModal" class="modal fade" role="dialog">
  <div class="modal-dialog">

    <!-- Modal content-->
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title">訊息</h4>
      </div>
      <div class="modal-body">
        <p id="msg"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
      </div>
    </div>

  </div>
</div>

</body>
<footer>
	<div class="col-sm-12 text-center" style="margin-top:20px;padding-top:20px;padding-bottom:20px;background-image: linear-gradient(to top, #e6e9f0 0%, #eef1f5 100%);">

	</div>
</footer>
</html>
