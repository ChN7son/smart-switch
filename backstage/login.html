<!DOCTYPE html>
<html lang="en">
<head>
	<title>智慧燈具管理</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
	<style>
	body {
      background-color: #f8f9fa;
    }

    .container {
      margin-top: 100px;
    }

    .login-card {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
    }

    .login-card h2 {
      text-align: center;
      color: #343a40;
      margin-bottom: 30px;
    }

    .form-control {
      border: 1px solid #ced4da;
      border-radius: 5px;
    }

    .form-control:focus {
      border-color: #80bdff;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    .btn-primary {
      background-color: #007bff;
      border-color: #007bff;
    }

    .btn-primary:hover {
      background-color: #0069d9;
      border-color: #0062cc;
    }
	</style>
	<script>
	function login(){
		const user = document.getElementById("username").value;
		const pwd = document.getElementById("password").value;
		const url = 'login.php';
		var data=new FormData();
		data.append("uid",user);
		data.append("pwd",pwd);
		var xhr = new XMLHttpRequest();
		xhr.addEventListener("load", uploadComplete, false);
		//xhr.addEventListener("error", uploadFailed, false);
		//xhr.addEventListener("abort", uploadCanceled, false);
		xhr.open("POST", url);
		xhr.send(data);
	}
	function uploadComplete(evt) {
		const result=JSON.parse(evt.target.responseText);
		if (result.status==1){
			document.getElementById('result').innerHTML = result.msg;
			location.href="index.html";
		} else{
			document.getElementById('result').innerHTML = '<span style="color:red">'+result.msg+'</span>';
		}
	}
	</script>
</head>
<body>

<div class="container">

	<div class="container">
		<div class="row justify-content-center">
			<div class="col-md-4">
			<div class="login-card">
				<h2>智慧燈具管理後台</h2>
					
					<small id="result" class="text-secondary"></small>
					<div class="mb-3">
						<label for="username" class="form-label">設備編號</label>
						<input type="text" class="form-control" id="username" placeholder="輸入設備編號">
					</div>
					<div class="mb-3">
						<label for="password" class="form-label">密碼</label>
						<input type="password" class="form-control" id="password" placeholder="輸入密碼">
					</div>
					<button class="btn btn-primary btn-block" onclick="login()">登入</button>

			</div>
			</div>
		</div>
	</div>

</div>


</body>
</html>
